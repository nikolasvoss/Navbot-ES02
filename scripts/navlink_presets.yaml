# Signal lists for `navlink capture --preset <name>` and `sub @<name>` in the
# shell. rate_hz 0 streams every control tick. A preset that names a signal the
# connected firmware does not have fails with "unknown signal <name>".
#
# trace, ctrl, bal and drive give the columns of the K55 to K58 log profiles
# (docs/robot/software/trace-capture.md). tests/scripts/test_navlink_presets.py
# checks them against those profiles and against the firmware's signals.def.h.
# 100 Hz is a row on every 7th control tick at the 710 ticks per second of
# 2026-10, which is what the K profiles print.
#
# Differences from the K columns: time_ms, sequence, logger_dropped and
# uart_write_failures are replaced by t_us and the link's frame numbers. The
# servo range columns are leg_pose_min_deg and leg_pose_max_deg (range = max - min).

trace:
  rate_hz: 100
  signals: [ch5_mode, voltage_min_raw_v, voltage_filtered_v, roll_deg, pitch_deg,
            servo1_cmd_deg, servo2_cmd_deg, servo3_cmd_deg, servo4_cmd_deg,
            leg_pose_min_deg, leg_pose_max_deg, motor1_target, motor2_target]

ctrl:
  rate_hz: 100
  signals: [ch5_mode, voltage_min_raw_v, voltage_filtered_v, roll_deg, gyro_z_rad_s,
            body_turn_command, motor1_target, motor2_target,
            leg_pose_min_deg, leg_pose_max_deg]

bal:
  rate_hz: 100
  signals: [ch5_mode, voltage_min_raw_v, roll_deg, motor1_target, motor2_target,
            leg_pose_min_deg, leg_pose_max_deg]

drive:
  rate_hz: 100
  signals: [ch5_mode, voltage_min_raw_v, voltage_filtered_v,
            imu_sequence, imu_read_time_us, imu_dt_s, imu_accepted_samples,
            imu_long_gap_count, imu_max_interval_us,
            control_start_us, control_execution_us, loop_interval_max_us,
            ch3_target, motor1_velocity_f, motor2_velocity_f, tick_dt_s, roll_deg,
            motor1_target, motor2_target, motor1_current_sp, motor2_current_sp,
            motor1_voltage_q, motor2_voltage_q, motor1_shaft_velocity, motor2_shaft_velocity,
            battery_raw_instant_v, leg_pose_min_deg, leg_pose_max_deg]

# The speed loop (BalanceController::speedLoopStep) runs every 20 ms;
# 100 Hz shows every step. The firmware has no speed-loop signals yet, so this
# preset only resolves against the test firmware (tests/navbot_link/fake_firmware.py).
speed_loop:
  rate_hz: 100
  signals: [speed_target, speed_measured, speed_p, speed_i, tilt_ref, tilt_clipped]
