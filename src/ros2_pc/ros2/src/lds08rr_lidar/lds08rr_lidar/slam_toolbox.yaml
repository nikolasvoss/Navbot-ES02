# slam_toolbox online async mapping from /scan_slam (tilt-gated /scan), seeded by wheel odometry (odom -> base_link TF from navbot_link_bridge).
slam_toolbox:
  ros__parameters:
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan_slam
    mode: mapping
    use_scan_matching: true
    use_scan_barycenter: true
    resolution: 0.025             # default 0.05; finer cells for the saved occupancy map that AMCL localizes on
    max_laser_range: 4.0          # default 25; capped at 4 m so mirror reflections and far noise stay out of the map
    map_update_interval: 2.0
    minimum_time_interval: 0.1              # jeden Scan verarbeiten (5 Hz, Stempel streuen um 0,2 s)

    # Scan matching stays close to the wheel odometry: the motion gate already drops smeared scans from turns,
    # so the default search window (±0.25 m, ±20°) suffices and a mismatch cannot pull the pose far away.
    correlation_search_space_dimension: 0.5
    coarse_search_angle_offset: 0.349
    distance_variance_penalty: 0.3          # default 0.5; smaller punishes deviation from odometry harder
    angle_variance_penalty: 0.5             # default 1.0

    # Strict loop closure: a false match optimizes the whole graph and makes the robot jump by meters.
    loop_search_maximum_distance: 3.0
    loop_match_minimum_response_fine: 0.6   # default 0.45
    loop_match_minimum_chain_size: 20       # default 10
    loop_match_maximum_variance_coarse: 2.0 # default 3.0

    # A scan is processed only after the odometry moved this far. A standing robot adds no scans.
    minimum_travel_distance: 0.05
    minimum_travel_heading: 0.1
    throttle_scans: 1
    transform_publish_period: 0.05
    tf_buffer_duration: 30.0
    do_loop_closing: true
    debug_logging: false
