# Nav2 for the NavBot: only the nodes navigation_launch.py starts. Stock Jazzy defaults, changed where the plan says so.
# Frames: map (global), odom (local, from wheel odometry), base_link (robot). Scans come from /scan_nav.
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: odom
    bt_loop_duration: 10
    default_server_timeout: 20
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::PoseProgressChecker"  # also counts a turn in place as progress
      required_movement_radius: 0.5
      required_movement_angle: 0.5
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.10  # AMCL jitters by several cm; at 0.06 the robot hovered 0.063-0.071 m off (2026-11-02)
      yaw_goal_tolerance: 0.12
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.3
      lookahead_dist: 0.3
      min_lookahead_dist: 0.2
      max_lookahead_dist: 0.6
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 1.0
      max_angular_accel: 5.0  # RPP ramps from the measured yaw rate: the first step (0.5 rad/s) must break the robot loose, 0.15 did not
      allow_reversing: false

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.10
      use_astar: false
      allow_unknown: false

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.5  # below about 0.45 rad/s the robot does not start turning
    rotational_acc_lim: 3.2

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.3, 0.0, 1.0]
    min_velocity: [-0.15, 0.0, -1.0]
    max_accel: [0.3, 0.0, 5.0]
    max_decel: [-0.5, 0.0, -5.0]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 0.7  # scan stamps mark the start of the 0.2 s sweep: 0.7 s tolerates one missed scan, not two
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons: ["stop_ahead", "slow_ahead"]
    observation_sources: ["scan"]
    stop_ahead:
      type: "polygon"
      action_type: "stop"
      min_points: 4
      visualize: true
      polygon_pub_topic: "stop_ahead_polygon"
      points: "[[0.0, -0.12], [0.30, -0.12], [0.30, 0.12], [0.0, 0.12]]"
    slow_ahead:
      type: "polygon"
      action_type: "limit"
      min_points: 4
      visualize: true
      polygon_pub_topic: "slow_ahead_polygon"
      points: "[[0.0, -0.15], [0.55, -0.15], [0.55, 0.15], [0.0, 0.15]]"
      slowdown_ratio: 0.5
      linear_limit: 0.3
      angular_limit: 1.0
    scan:
      type: "scan"
      topic: "/scan_nav"
      min_height: 0.0
      max_height: 1.0
      enabled: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.10
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan_nav
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 1.5  # a floor hit that the tilt estimate misses needs 0.08 rad pitch at 1.5 m, 0.05 rad at 2.5 m
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.25

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.10
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan_nav
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 1.5  # a floor hit that the tilt estimate misses needs 0.08 rad pitch at 1.5 m, 0.05 rad at 2.5 m
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.25
