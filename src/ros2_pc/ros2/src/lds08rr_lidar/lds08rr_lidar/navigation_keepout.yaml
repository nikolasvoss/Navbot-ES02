# Added to navigation.yaml by navigation_launch.py only with a keepout mask; later parameters override earlier ones.
global_costmap:
  global_costmap:
    ros__parameters:
      plugins: ["static_layer", "obstacle_layer", "inflation_layer", "keepout_filter"]
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: true
        filter_info_topic: "/costmap_filter_info"

# navigation_launch.py sets yaml_filename.
filter_mask_server:
  ros__parameters:
    use_sim_time: false
    frame_id: map
    topic_name: /keepout_filter_mask

costmap_filter_info_server:
  ros__parameters:
    use_sim_time: false
    type: 0
    filter_info_topic: /costmap_filter_info
    mask_topic: /keepout_filter_mask
    base: 0.0
    multiplier: 1.0
