# AMCL localization on the saved map, scans from /scan_slam (tilt-gated /scan), motion from wheel odometry (odom -> base_link TF from navbot_link_bridge).
# No map_server section: a node-specific yaml_filename here would override the map path the launch passes in.
amcl:
  ros__parameters:
    base_frame_id: base_link      # default base_footprint
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /scan_slam        # default scan
    robot_model_type: nav2_amcl::DifferentialMotionModel
    laser_model_type: likelihood_field
    laser_max_range: 8.0          # provisional; the LDS08RR range is not yet measured (default: from the scan)
    max_beams: 60
    min_particles: 500
    max_particles: 8000           # default 2000; the global search spreads particles over the whole map
    set_initial_pose: false       # global search starts from /reinitialize_global_localization, not a hint
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_d: 0.1             # default 0.25; a standing robot adds no updates, /request_nomotion_update forces them
    update_min_a: 0.1             # default 0.2
